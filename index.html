<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Palette Picker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one narrow column; a control bar, then ten full-width palette strips stacked like paint chips */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --fg: #16181d;
  --muted: #5e6470;
  --line: #dde0e6;
  --accent: #2f4ad0;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121418; --surface: #1b1e24; --fg: #eceef2; --muted: #9aa1ad; --line: #2c3039; --accent: #8fa2ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121418; --surface: #1b1e24; --fg: #eceef2; --muted: #9aa1ad; --line: #2c3039; --accent: #8fa2ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 64px;
}
.wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(2rem, 5vw, 2.8rem); line-height: 1; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
.sub { color: var(--muted); margin: 8px 0 0; max-width: 46ch; }
.controls { display: flex; align-items: end; gap: 10px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; }
label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
select, button {
  font: inherit; font-size: 14px; height: 40px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 0 12px; cursor: pointer;
}
select { padding-right: 8px; min-width: 120px; }
button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 500; padding: 0 16px; }
button:hover { border-color: var(--muted); }
button.primary:hover { opacity: .88; }
select:focus-visible, button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.list { display: flex; flex-direction: column; gap: 18px; list-style: none; margin: 0; padding: 0; }
.pal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.pal-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; }
.pal-name { font-size: 13px; color: var(--muted); }
.pal-name b { color: var(--fg); font-weight: 500; }
.copy-all { height: 30px; font-size: 12px; padding: 0 10px; }
.strip { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.chip {
  all: unset; cursor: pointer; display: flex; flex-direction: column; justify-content: flex-end;
  min-height: 112px; padding: 10px; position: relative;
}
.hex { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; }
.hint { font-family: var(--mono); font-size: 11px; opacity: 0; transition: opacity .15s; }
.chip:hover .hint, .chip:focus-visible .hint { opacity: .75; }
.chip.done .hint { opacity: 1; }
footer { color: var(--muted); font-size: 13px; }

@media (max-width: 560px) {
  .strip { grid-template-columns: 1fr; }
  .chip { min-height: 56px; flex-direction: row; justify-content: space-between; align-items: center; }
}
@media (prefers-reduced-motion: reduce) { .hint { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Palette Picker</h1>
      <p class="sub">Twenty colour combinations built from colour-wheel harmonies. Click a swatch to copy its hex code.</p>
    </div>
    <div class="controls">
      <div class="field">
        <label for="count">Colours</label>
        <select id="count">
          <option value="2">2 colours</option>
          <option value="3">3 colours</option>
          <option value="4" selected>4 colours</option>
          <option value="5">5 colours</option>
          <option value="6">6 colours</option>
        </select>
      </div>
      <button id="regen" class="primary" type="button">New combinations</button>
    </div>
  </header>

  <ol class="list" id="list" aria-live="polite"></ol>

  <footer>Colours are generated in the OKLCH space, so lightness steps look even to the eye. Shortcut: press <kbd>Space</kbd> for new combinations.</footer>
</div>

<script>
(function () {
  // ---------- colour maths: OKLCH -> sRGB ----------
  function oklchToRgb(L, C, h) {
    const hr = h * Math.PI / 180, a = C * Math.cos(hr), b = C * Math.sin(hr);
    const l_ = L + 0.3963377774 * a + 0.2158037573 * b;
    const m_ = L - 0.1055613458 * a - 0.0638541728 * b;
    const s_ = L - 0.0894841775 * a - 1.2914855480 * b;
    const l = l_ ** 3, m = m_ ** 3, s = s_ ** 3;
    const lin = [
       4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
      -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
      -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
    ];
    return lin.map(x => x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055);
  }
  function inGamut(rgb) { return rgb.every(v => v >= -0.0005 && v <= 1.0005); }
  function toHex(L, C, h) {
    let rgb = oklchToRgb(L, C, h);
    while (!inGamut(rgb) && C > 0) { C = Math.max(0, C - 0.005); rgb = oklchToRgb(L, C, h); }
    return "#" + rgb.map(v => Math.round(Math.min(1, Math.max(0, v)) * 255).toString(16).padStart(2, "0")).join("");
  }

  // ---------- helpers ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const wrapHue = h => ((h % 360) + 360) % 360;

  // Evenly spread lightness values, lightly jittered
  function lightnessSteps(n, lo, hi) {
    if (n === 1) return [rand(lo, hi)];
    const out = [];
    for (let i = 0; i < n; i++) out.push(lo + (hi - lo) * i / (n - 1) + rand(-0.025, 0.025));
    return out;
  }
  // Chroma tapers near black and white so colours stay natural
  function chromaFor(L, base) { const taper = 1 - Math.pow(Math.abs(L - 0.62) / 0.42, 2); return Math.max(0.015, base * Math.max(0.25, taper)); }

  // ---------- harmony schemes ----------
  // Each returns an array of {L, C, h}
  const schemes = {
    "Analogous": (n, h0) => {
      const step = rand(18, 32), C = rand(0.09, 0.16);
      const Ls = shuffle(lightnessSteps(n, 0.38, 0.9));
      return Ls.map((L, i) => ({ L, C: chromaFor(L, C), h: wrapHue(h0 + (i - (n - 1) / 2) * step) }));
    },
    "Monochromatic": (n, h0) => {
      const C = rand(0.07, 0.15);
      return lightnessSteps(n, 0.3, 0.94).map(L => ({ L, C: chromaFor(L, C), h: wrapHue(h0 + rand(-6, 6)) }));
    },
    "Complementary": (n, h0) => {
      const C = rand(0.08, 0.15), Ls = shuffle(lightnessSteps(n, 0.35, 0.92));
      return Ls.map((L, i) => ({ L, C: chromaFor(L, C) * (i % 2 ? 0.85 : 1), h: wrapHue(h0 + (i % 2) * 180 + rand(-8, 8)) }));
    },
    "Split complementary": (n, h0) => {
      const offs = [0, 150, 210], C = rand(0.08, 0.15), Ls = shuffle(lightnessSteps(n, 0.36, 0.9));
      return Ls.map((L, i) => ({ L, C: chromaFor(L, C), h: wrapHue(h0 + offs[i % 3] + rand(-6, 6)) }));
    },
    "Triadic": (n, h0) => {
      const C = rand(0.08, 0.14), Ls = shuffle(lightnessSteps(n, 0.4, 0.88));
      return Ls.map((L, i) => ({ L, C: chromaFor(L, C), h: wrapHue(h0 + (i % 3) * 120 + rand(-6, 6)) }));
    },
    "Tetradic": (n, h0) => {
      const offs = [0, 60, 180, 240], C = rand(0.07, 0.13), Ls = shuffle(lightnessSteps(n, 0.4, 0.88));
      return Ls.map((L, i) => ({ L, C: chromaFor(L, C), h: wrapHue(h0 + offs[i % 4] + rand(-5, 5)) }));
    },
    "Neutrals + accent": (n, h0) => {
      const out = [], Ls = lightnessSteps(n - 1, 0.25, 0.95), tint = rand(0.008, 0.025);
      Ls.forEach(L => out.push({ L, C: tint, h: wrapHue(h0 + 180 + rand(-20, 20)) }));
      out.push({ L: rand(0.55, 0.7), C: rand(0.13, 0.2), h: h0 });
      return out;
    },
    "Muted earth": (n, h0) => {
      const base = rand(30, 100), Ls = shuffle(lightnessSteps(n, 0.32, 0.88));
      return Ls.map((L, i) => ({ L, C: chromaFor(L, rand(0.04, 0.09)), h: wrapHue(base + (i - (n - 1) / 2) * rand(14, 28) + (i === n - 1 ? 140 : 0)) }));
    },
    "Pastel": (n, h0) => {
      const step = 360 / Math.max(n, 3) * rand(0.45, 0.8);
      return Array.from({ length: n }, (_, i) => ({ L: rand(0.84, 0.93), C: rand(0.05, 0.08), h: wrapHue(h0 + i * step) }));
    }
  };

  // ---------- rendering ----------
  const list = document.getElementById("list");
  const countSel = document.getElementById("count");

  function build(n) {
    let names = shuffle(Object.keys(schemes));
    if (n === 2) names = names.filter(s => s !== "Tetradic");
    const picks = [];
    while (picks.length < 20) picks.push(names[picks.length % names.length]);
    shuffle(picks);
    const hueStart = rand(0, 360);
    return picks.map((name, i) => {
      const h0 = wrapHue(hueStart + i * 137.5 + rand(-15, 15)); // golden-angle walk keeps the set varied
      const cols = schemes[name](n, h0).sort((a, b) => b.L - a.L);
      return { name, cols: cols.map(c => ({ hex: toHex(c.L, c.C, c.h), dark: c.L < 0.62 })) };
    });
  }

  function copy(text, done) {
    const fallback = () => {
      const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e) {} ta.remove(); done();
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }

  function render() {
    const n = +countSel.value;
    list.innerHTML = "";
    build(n).forEach((p, idx) => {
      const li = document.createElement("li"); li.className = "pal";
      const head = document.createElement("div"); head.className = "pal-head";
      head.innerHTML = `<span class="pal-name"><b>${String(idx + 1).padStart(2, "0")}</b> · ${p.name}</span>`;
      const all = document.createElement("button"); all.type = "button"; all.className = "copy-all"; all.textContent = "Copy all";
      all.addEventListener("click", () => copy(p.cols.map(c => c.hex.toUpperCase()).join(", "), () => { all.textContent = "Copied"; setTimeout(() => all.textContent = "Copy all", 1200); }));
      head.appendChild(all);
      const strip = document.createElement("div"); strip.className = "strip"; strip.style.setProperty("--n", n);
      p.cols.forEach(c => {
        const b = document.createElement("button"); b.type = "button"; b.className = "chip";
        b.style.background = c.hex; b.style.color = c.dark ? "#ffffff" : "#16181d";
        b.setAttribute("aria-label", "Copy " + c.hex.toUpperCase());
        b.innerHTML = `<span class="hint">copy</span><span class="hex">${c.hex}</span>`;
        b.addEventListener("click", () => copy(c.hex.toUpperCase(), () => {
          const h = b.querySelector(".hint"); h.textContent = "copied"; b.classList.add("done");
          setTimeout(() => { h.textContent = "copy"; b.classList.remove("done"); }, 1200);
        }));
        strip.appendChild(b);
      });
      li.append(head, strip);
      list.appendChild(li);
    });
  }

  try { const saved = localStorage.getItem("palette-count"); if (saved && /^[2-6]$/.test(saved)) countSel.value = saved; } catch (e) {}
  countSel.addEventListener("change", () => { try { localStorage.setItem("palette-count", countSel.value); } catch (e) {} render(); });
  document.getElementById("regen").addEventListener("click", render);
  document.addEventListener("keydown", e => {
    if (e.code === "Space" && !["SELECT", "BUTTON", "INPUT"].includes(document.activeElement.tagName)) { e.preventDefault(); render(); }
  });
  render();
})();
</script>

</body></html>
